<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roast Toast Coast Cafe</title>
    <link href="https://fonts.cdnfonts.com/css/bogart" rel="stylesheet">
    <style>
        body {
            background-color: black;
            font-family: 'Bogart', sans-serif;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            overflow: hidden;
        }

        @media (max-width: 700px) {
            body {
                grid-template-columns: 1fr;
                height: auto;
                overflow: auto;
            }
            .image-container {
                height: 40vh;
            }
        }

        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .image-container {
            background-image: url('https://images.unsplash.com/photo-1514066558159-fc8c737ef259?q=80&w=2574&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8MHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
            height: 100%;
        }

        .header-container {
            background: wheat;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            width: 90%;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .header-container h1 {
            color: #5a3e00;
            font-size: 3em;
            margin: 0 0 10px 0;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            line-height: 1.2;
        }

        .header-container p {
            font-size: 1.3em;
            color: #3b2800;
            margin: 0;
        }

        .menu-section {
            background-color: #000000;
            color: #FFFFFF;
            padding: 10px;
            margin: 20px 0 20px 10%;
            width: 60%;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(189, 180, 180, 0.7);
            text-align: center;
        }

        .menu-section h2 {
            color: #FFCC00;
            font-size: 2em;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .menu-toggle:hover {
            color: #FF9933;
        }

        .menu-items {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: none;
        }

        .menu-items li {
            background-color: #222222;
            color: #F7F7F7;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
            font-size: 1.1em;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="header-container">
            <h1>Welcome to the<br>Roast Toast Coast Cafe!</h1>
            <p>Where flavor meets the shore!</p>
        </div>

        <section class="menu-section">
            <h2 class="menu-toggle">Our Menu</h2>
            <ul class="menu-items">
                <li>Breezy Brews</li>
                <li>Toasty Delights</li>
                <li>Coastal Bites</li>
                <li>Sunset Sips</li>
            </ul>
        </section>
    </div>

    <div class="image-container"></div>

    <script>
        function toggleMenuItems() {
            var menuItems = document.querySelector('.menu-items');
            menuItems.style.display = menuItems.style.display === 'block' ? 'none' : 'block';
        }

        document.querySelector('.menu-toggle').addEventListener('click', toggleMenuItems);
    </script>
</body>
</html>
